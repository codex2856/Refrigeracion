<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081226" />

    <!--
      SEO: el nombre comercial se toma de business.name en src/data/business.ts
      (actualmente "Refrigeración WAS"). Si vuelve a cambiar, actualiza también
      <title>, la meta description, los OG tags y el JSON-LD de abajo.
    -->
    <title>Refrigeración WAS | Técnico de Refrigeración en Caracas</title>
    <meta
      name="description"
      content="Refrigeración WAS: técnico de refrigeración en Caracas. Reparación y mantenimiento de aires acondicionados, neveras, lavadoras y electrodomésticos. Diagnóstico y atención directa con el técnico."
    />
    <link rel="canonical" href="https://TU-DOMINIO-AQUI.com/" />
    <!-- ^ Reemplaza TU-DOMINIO-AQUI.com por el dominio real cuando esté disponible (también en sitemap.xml y robots.txt). -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:site_name" content="Refrigeración WAS" />
    <meta property="og:title" content="Refrigeración WAS | Técnico de Refrigeración en Caracas" />
    <meta
      property="og:description"
      content="Reparación y mantenimiento de aires acondicionados, neveras, lavadoras y electrodomésticos en Caracas. Contacta directamente con el técnico."
    />
    <meta property="og:url" content="https://TU-DOMINIO-AQUI.com/" />
    <meta property="og:image" content="https://TU-DOMINIO-AQUI.com/og-image.jpg" />
    <!-- ^ Sube una imagen og-image.jpg (1200x630) a /public cuando haya fotografías reales. -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Refrigeración WAS | Técnico de Refrigeración en Caracas" />
    <meta
      name="twitter:description"
      content="Reparación y mantenimiento de aires acondicionados, neveras, lavadoras y electrodomésticos en Caracas."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Datos estructurados Schema.org (LocalBusiness / HVACBusiness).
      Solo se incluyen campos confirmados. NO se ha inventado dirección ni
      valoraciones. Añade "address" (con calle) e "image" en cuanto tengamos
      esos datos reales (ver src/data/business.ts). El fin de semana es
      "bajo consulta" y por eso no se incluye como horario fijo aquí.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HVACBusiness",
        "name": "Refrigeración WAS",
        "description": "Servicio técnico de reparación y mantenimiento de aires acondicionados, neveras, lavadoras y electrodomésticos en Caracas, Venezuela.",
        "telephone": "+58 414-324-3716",
        "areaServed": {
          "@type": "City",
          "name": "Caracas, Venezuela"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Caracas",
          "addressCountry": "VE"
        },
        "founder": {
          "@type": "Person",
          "name": "Wilfredo Salazar"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "17:00"
          }
        ],
        "sameAs": ["https://instagram.com/refrigeracion_was"],
        "url": "https://TU-DOMINIO-AQUI.com/",
        "priceRange": ""
      }
    </script>
    <!--
      Cuando las respuestas del FAQ (src/data/faq.ts) estén confirmadas
      (sin placeholders "[Información pendiente de confirmar]"), agrega
      aquí un segundo <script type="application/ld+json"> con @type
      "FAQPage" — mejora el SEO, pero no antes de tener las respuestas
      reales (Google penaliza contenido de marcador de posición indexado).
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
